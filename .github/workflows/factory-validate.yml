name: factory-validate

on:
  pull_request:
    paths:
      - "contracts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/factory-validate.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Type check
        run: pnpm typecheck

      - name: Validate spine manifest
        run: pnpm factory validate ./contracts

      - name: Test
        run: pnpm test
