version: 1
profile: example-lifecycle-spine-v1
status: example
schema: artifact-schema.yaml
spine_doc: example-spine-doc.md

# Generic asset lifecycle. Each folder maps to one phase below.
# Folder mapping is in folder-binding.yaml.

phases:
  - id: input
    label: "input intake"
    folders: [sources/]
    purpose: "receive external material before refinement"
    next: [processing, commitment, memory]

  - id: processing
    label: "candidate review"
    folders: [ideas/, memory/visions/]
    purpose: "review candidate ideas / preserve vision statements"
    next: [commitment, terminal]

  - id: commitment
    label: "committed judgment"
    folders: [decisions/]
    purpose: "judgments with fixed timestamp and rationale"
    next: [execution, control]

  - id: execution
    label: "execution"
    folders: [tasks/]
    purpose: "single execution units"
    next: [output_internal, output_external, memory, terminal]

  - id: output_internal
    label: "internal build"
    folders: [projects/]
    purpose: "internal reference / experiment"
    next: [output_external, terminal]

  - id: output_external
    label: "external deployment"
    folders: [products/]
    purpose: "externally deployed targets"
    next: [memory, terminal]

  - id: memory
    label: "long-term memory"
    folders: [memory/roots/, memory/identity/, memory/visions/, memory/operations/]
    purpose: "context preserved across sessions"
    next: [control]

  - id: control
    label: "control plane (rules / manifests / templates)"
    folders: [protocol/, registry/, templates/]
    purpose: "defines and enforces the lifecycle itself"
    next: []

  - id: cross_cutting
    label: "chronological log"
    folders: [journey/]
    purpose: "work log spanning all phases"
    next: [memory]

  - id: terminal
    label: "archive"
    folders: [archive/]
    purpose: "retired state with preserved history"
    next: []

  - id: automation
    label: "automation / control plane execution"
    folders: [scripts/, packages/, tools/, .github/]
    purpose: "validators / checkers / builders / CI"
    next: [snapshot, control]

  - id: snapshot
    label: "read-only operational view"
    folders: [dashboard/]
    purpose: "snapshots emitted by automation"
    next: []

# State sequence per artifact type. Lifecycle_state of each artifact must
# appear in its type's sequence below.
states:
  source:
    sequence: [raw, extracted, normalized, indexed, archived]
  idea:
    sequence: [proposed, parked, promoted, dropped, archived]
  decision:
    sequence: [draft, accepted, superseded, archived]
  task:
    sequence: [inbox, active, blocked, done, dropped, archived]
  project:
    sequence: [seed, active, frozen, archived]
  product:
    sequence: [charter_only, build_ready, deployed, hold, archived]
  memory_root:
    sequence: [active, archived]
  memory_identity:
    sequence: [active, superseded]
  memory_vision:
    sequence: [active, promoted, archived]
  memory_operation:
    sequence: [active, archived]
  protocol_canon:
    sequence: [draft, candidate, canonical, deprecated]
  protocol_charter:
    sequence: [draft, accepted, retired]
  protocol_kernel:
    sequence: [draft, canonical, deprecated]
  protocol_grammar:
    sequence: [draft, canonical, deprecated]
  protocol_schema:
    sequence: [draft, canonical, deprecated]
  template:
    sequence: [draft, active, deprecated]
  registry_index:
    sequence: [draft, active, deprecated]
  journey_entry:
    sequence: [recorded]
  archive_entry:
    sequence: [archived]
  automation_script:
    sequence: [draft, active, deprecated]
  package:
    sequence: [draft, active, deprecated]
  tool:
    sequence: [draft, active, deprecated]
  ci_workflow:
    sequence: [draft, active, deprecated]
  dashboard_snapshot:
    sequence: [generated, stale, archived]
  doc_plan:
    sequence: [draft, active, superseded, archived]

# Allowed parent.type → child.type transitions.
transitions:
  - from: source
    to: [idea, decision, task, registry_index, archive_entry]

  - from: idea
    to: [decision, archive_entry]

  - from: memory_vision
    to: [idea, decision, archive_entry]

  - from: decision
    to: [task, protocol_canon, protocol_charter, archive_entry]

  - from: task
    to: [project, product, memory_operation, journey_entry, archive_entry]

  - from: project
    to: [product, archive_entry]

  - from: product
    to: [archive_entry]

  - from: protocol_canon
    to: [protocol_canon, registry_index, archive_entry]

  - from: registry_index
    to: [registry_index, archive_entry]

  - from: automation_script
    to: [dashboard_snapshot, ci_workflow, archive_entry]

  - from: ci_workflow
    to: [ci_workflow, archive_entry]

  - from: package
    to: [package, archive_entry]

  - from: tool
    to: [tool, archive_entry]

  - from: doc_plan
    to: [task, decision, doc_plan, archive_entry]

  - from: dashboard_snapshot
    to: [archive_entry]

  - from: memory_root
    to: [archive_entry]

# Gate ids per transition. Gate definitions live outside this bundle.
gates:
  source_to_idea:        gate.discussion-planning
  source_to_decision:    gate.discussion-planning
  idea_to_decision:      gate.discussion-planning
  decision_to_task:      gate.task-scope
  decision_to_canon:     gate.canon-change
  task_to_project:       gate.frame-guard
  task_to_product:       gate.frame-guard
  project_to_product:    gate.frame-guard
  product_to_archive:    gate.archive-sync
  any_to_canon:          gate.canon-change

# Optional metadata. Not enforced by the validator — illustrative only.
loop_binding:
  example_loop_a:
    spec: docs/example-loop-a.md
    reads:  [tasks/done, decisions/]
    writes: [memory/, journey/]
  example_loop_b:
    spec: docs/example-loop-b.md
    reads:  [tasks/active, protocol/, templates/]
    writes: [projects/, products/, tasks/done]
