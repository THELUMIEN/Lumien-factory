version: 1
profile: example-folder-binding-v1
status: example
schema: artifact-schema.yaml
spine: lifecycle-spine.yaml

# Folder ↔ lifecycle phase mapping plus backflow guards.
# Folders below are the canonical phase containers. Sub-axes are illustrative.

folders:
  sources/:
    phase: input
    accepts: [source]
    upstream: [external]
    downstream: [ideas/, decisions/, registry/, archive/]
    gate: gate.intake-separation
    rule: "vendor sources stay quarantined under sources/raw/ and are referenced only through normalized wrappers."

  ideas/:
    phase: processing
    accepts: [idea]
    upstream: [sources/, memory/visions/]
    downstream: [decisions/, archive/]
    gate: gate.discussion-planning
    rule: "ideas carry no execution mandate. promotion to decision or archive only."

  decisions/:
    phase: commitment
    accepts: [decision]
    upstream: [ideas/, sources/, memory/, tasks/]
    downstream: [tasks/, protocol/canon/, protocol/charters/, archive/]
    gate:
      default:      gate.discussion-planning
      canon_change: gate.canon-change
    rule: "committed judgments are timestamp-fixed. revisions create a new decision; the prior decision is marked superseded."

  tasks/:
    phase: execution
    accepts: [task]
    upstream: [decisions/, ideas/, sources/, memory/]
    downstream: [projects/, products/, memory/operations/, journey/, archive/]
    gate: gate.task-scope
    rule: "one task card per execution unit."

  projects/:
    phase: output_internal
    accepts: [project]
    upstream: [tasks/]
    downstream: [products/, archive/]
    gate: gate.frame-guard
    rule: "internal build / reference. promotion to a product moves to products/."

  products/:
    phase: output_external
    accepts: [product]
    upstream: [projects/, tasks/]
    downstream: [archive/products/]
    gate: gate.archive-sync
    rule: "externally deployed products. retired products move to archive/products/."

  memory/:
    phase: memory
    accepts: [memory_root, memory_identity, memory_vision, memory_operation]
    upstream: [decisions/, tasks/, journey/, sources/]
    downstream: [protocol/canon/, ideas/]
    gate: gate.record-discipline
    rule: "memory roots are not deleted; superseded roots move to archive/."

  protocol/:
    phase: control
    accepts:
      - protocol_canon
      - protocol_charter
      - protocol_kernel
      - protocol_grammar
      - protocol_schema
    upstream: []
    downstream: [all phases — gates / authority origin]
    gate: gate.canon-change
    rule: "protocol has zero runtime dependency. canon changes only via decision → canon transition + canon-change gate."

  registry/:
    phase: control
    accepts: [registry_index]
    upstream: [all folders — manifest input]
    downstream: [validators, dashboards]
    gate: gate.registry-sync
    rule: "registry is the single source of truth for cross-cutting indices. inconsistency is a defect."

  templates/:
    phase: control
    accepts: [template]
    upstream: [protocol/grammar/]
    downstream: [tasks/, decisions/, ideas/, memory/, sources/, ...]
    gate: none
    rule: "templates enforce the schema (artifact-schema.yaml) at authoring time."

  journey/:
    phase: cross_cutting
    accepts: [journey_entry]
    upstream: [tasks/, decisions/, sources/]
    downstream: [memory/]
    gate: none
    rule: "chronological log. one-way — journey does not write into other folders."

  archive/:
    phase: terminal
    accepts: [archive_entry]
    upstream: [all phases]
    downstream: []
    gate: gate.archive-sync
    rule: "move via git mv only — preserve history."

  scripts/:
    phase: automation
    accepts: [automation_script]
    upstream: []
    downstream: [dashboard/, registry/, .github/]
    gate: none
    rule: "scripts enforce the spine in code — input is the control layer, output is snapshots / reports."

  packages/:
    phase: automation
    accepts: [package]
    upstream: []
    downstream: [scripts/, products/, projects/]
    gate: none
    rule: "shared libraries — dependency direction is outside-in only."

  tools/:
    phase: automation
    accepts: [tool]
    upstream: []
    downstream: [scripts/, developer CLIs]
    gate: none
    rule: "developer utilities. registration in the manifest is recommended."

  .github/:
    phase: automation
    accepts: [ci_workflow]
    upstream: [scripts/]
    downstream: [PR / push validation]
    gate: none
    rule: ".github/workflows/ invoke scripts/ to run spine checks automatically."

  dashboard/:
    phase: snapshot
    accepts: [dashboard_snapshot]
    upstream: [scripts/dashboard/]
    downstream: [external readers]
    gate: none
    rule: "read-only operational view emitted by automation."

  docs/:
    phase: control
    accepts: [doc_plan]
    upstream: [decisions/, ideas/, sources/]
    downstream: [tasks/, protocol/, dashboard/]
    gate: none
    rule: "plans / review notes / operating guides. no canonical authority."

# Forbidden folder-to-folder directions. Manifest entries violating these
# are rejected by the validator (checkBackflow).
backflow_forbidden:
  - from: protocol/
    to:   [tasks/, projects/, products/, sources/, ideas/, decisions/, dashboard/, scripts/]
    note: "protocol has zero runtime dependency. promotion happens via spine#transitions only."
  - from: registry/
    to:   [projects/, products/, tasks/, ideas/, sources/, dashboard/]
    note: "registry is index-only — it points at assets without depending on them."
  - from: products/
    to:   [protocol/, registry/]
    note: "deployed products cannot mutate the control layer."
  - from: projects/
    to:   [protocol/, registry/]
    note: "internal builds cannot mutate the control layer."
  - from: dashboard/
    to:   [protocol/, registry/, decisions/, tasks/, projects/, products/, memory/]
    note: "dashboard is read-only — it does not emit content."
  - from: scripts/
    to:   [protocol/, registry/]
    note: "scripts enforce the control layer; they do not mutate it."
  - from: packages/
    to:   [protocol/, registry/, decisions/]
    note: "shared libraries cannot mutate the control layer."
