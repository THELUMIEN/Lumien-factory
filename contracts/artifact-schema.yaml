version: 1
profile: example-artifact-schema-v1
status: example
spine_doc: example-spine-doc.md

# Shared schema for all artifact types in the example bundle.

required_fields:
  - id              # canonical identifier
  - type            # artifact type, see types[]
  - path            # repo-relative path
  - layer           # layer label, e.g. L0..L7
  - lifecycle_state # see lifecycle-spine.yaml#states
  - authority       # canon | grammar | charter | template | registry | runtime | none

optional_fields:
  - category          # free-form category id
  - parent            # upstream artifact id (single)
  - children          # downstream artifact ids (list)
  - produces          # what this artifact emits (artifact id list or symbolic name)
  - consumes          # what this artifact reads (artifact id list or path)
  - gate              # gate id required to advance
  - verification      # passed | warn | failed | pending
  - provenance:
      created_by:     # role or agent
      created_at:     # ISO date
      updated_at:     # ISO date
      source_event:   # decision id, task id, or external trigger
  - tags              # free-form labels

types:
  - id: source
    folder: sources/
    lifecycle_phase: input
    description: "raw / extracted / normalized external input material"

  - id: idea
    folder: ideas/
    lifecycle_phase: processing
    description: "candidate idea under review (no execution mandate)"

  - id: decision
    folder: decisions/
    lifecycle_phase: commitment
    description: "committed judgment with fixed timestamp and rationale"

  - id: task
    folder: tasks/
    lifecycle_phase: execution
    description: "single execution unit"

  - id: project
    folder: projects/
    lifecycle_phase: output_internal
    description: "internal build / reference implementation"

  - id: product
    folder: products/
    lifecycle_phase: output_external
    description: "externally deployed service or product"

  - id: memory_root
    folder: memory/roots/
    lifecycle_phase: memory
    description: "long-lived root context (do not discard)"

  - id: memory_identity
    folder: memory/identity/
    lifecycle_phase: memory
    description: "identity evolution record"

  - id: memory_vision
    folder: memory/visions/
    lifecycle_phase: memory
    description: "vision statement (no execution mandate)"

  - id: memory_operation
    folder: memory/operations/
    lifecycle_phase: memory
    description: "operational memo / cost report / runtime note"

  - id: protocol_canon
    folder: protocol/canon/
    lifecycle_phase: control
    description: "governing rule. mutated only via a change-gate transition"

  - id: protocol_charter
    folder: protocol/charters/
    lifecycle_phase: control
    description: "domain mission contract"

  - id: protocol_kernel
    folder: protocol/kernel/
    lifecycle_phase: control
    description: "runtime / orchestration baseline"

  - id: protocol_grammar
    folder: protocol/grammar/
    lifecycle_phase: control
    description: "production rule set"

  - id: protocol_schema
    folder: protocol/schema/
    lifecycle_phase: control
    description: "data envelope / validation structure"

  - id: template
    folder: templates/
    lifecycle_phase: control
    description: "writing template per artifact type"

  - id: registry_index
    folder: registry/
    lifecycle_phase: control
    description: "cross-cutting index / manifest"

  - id: journey_entry
    folder: journey/
    lifecycle_phase: cross_cutting
    description: "chronological work log"

  - id: archive_entry
    folder: archive/
    lifecycle_phase: terminal
    description: "superseded / retired artifact (history preserved)"

  - id: automation_script
    folder: scripts/
    lifecycle_phase: automation
    description: "executable script enforcing the spine"

  - id: package
    folder: packages/
    lifecycle_phase: automation
    description: "internal shared library package"

  - id: tool
    folder: tools/
    lifecycle_phase: automation
    description: "developer CLI / utility"

  - id: ci_workflow
    folder: .github/
    lifecycle_phase: automation
    description: "CI workflow that invokes scripts to validate the spine"

  - id: dashboard_snapshot
    folder: dashboard/
    lifecycle_phase: snapshot
    description: "read-only operational view emitted by automation"

  - id: doc_plan
    folder: docs/
    lifecycle_phase: control
    description: "implementation plan / review note / operating guide"
